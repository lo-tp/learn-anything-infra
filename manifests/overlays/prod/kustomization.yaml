namespace: learn-anything

resources:
  - namespace.yaml
  - ingress.yaml
  - ../../base

patches:
  # The two tiers that have no image yet, and that are meant to be idle when
  # unused. Read that file before changing this number: it is a bill, and a pod
  # stuck in ImagePullBackOff is billed exactly like one that starts.
  - path: replica-floor.yaml

# What production is running, stated here rather than passed in at deploy time:
# this block is the record, and `git diff` of it is the thing a person approves.
#
# By digest, never tag — a tag can be re-pointed under a running rollout and a
# digest cannot. The tag is written beside the digest only so a human can find the
# build in the registry console afterwards; nothing in the cluster reads it.
#
# The frontend and sandbox have no image to name, so they keep the base's
# `:placeholder`, which is a visible gap rather than a plausible-looking stale
# digest (M2 builds them; CI's deploy step will set all three at once).
#
# The backend's image is built by the pipeline in the backend repository
# (.github/workflows/build-image.yml): the tag is `sha-<commit>`, so the commit a
# review saw is the commit that runs. It arrived at that by way of two fixes to
# that workflow — a WIF provider path in the project-number form STS accepts, and
# minting the registry token with gcloud rather than trusting an action output.
#
# What is *not* here is a lesson: digest 5b52c5e9… (16bc52f6) is the hand-built
# image whose `USER app` made `runAsNonRoot: true` unverifiable — its pod sat in
# CreateContainerConfigError while its own migration Job ran happily. That build and
# the two other laptop-built ones (local-d93da1ad, local-m5-probe) have since been
# deleted from the registry: production should not be able to point at something no
# pipeline produced.
images:
  - name: asia-east2-docker.pkg.dev/learn-anything-510905/learn-anything/learn-anything-backend
    # The cookie-scope fix (core/security.cookie_policy) rides with the ingress:
    # a shared-domain cookie is only observable once two hosts are actually served.
    digest: sha256:edc2b86f38035a1f4d15fc43eb570b2ddcbeb7333d2ede9ffb07af79668f16c9  # sha-0103de9cc92646fe3a703c615596eb30bfcc4ce5 (CI, 0103de9c), built 2026-10-20
  # The frontend and sandbox images come from their own repositories' Actions runs.
  # Their workflows' smoke steps are the gate that matters for these two: the
  # frontend must redirect an anonymous visitor and render a page whose text comes
  # from its `messages/` copy; the sandbox must answer `/api/compile`. Both checks
  # found real bugs in the image — a devDependency's lifecycle hook killing the
  # production install, and a working directory the process could not write to.
  # The `name:` here is the fully-qualified string as base declares it, the same
  # shape as the backend entry above; a short name would match nothing and the
  # render would keep the `:placeholder` (which is what the first version of these
  # two entries did, and the deploy reported no change at all).
  - name: asia-east2-docker.pkg.dev/learn-anything-510905/learn-anything/learn-anything-frontend
    digest: sha256:0242e62567a045c2a23e53ed0e2e0f23d30bed929a0e903cd12fe622dfa50fae  # sha-be72fcd3b004691947ee6c364c41d1f6584b3bbd (CI, be72fcd3), built 2026-10-19
    # No `newApiBase` override anywhere: see manifests/base/frontend.yaml. Pointing
    # the browser at a staging surface is a new image built with that origin, not a
    # manifest change.
  - name: asia-east2-docker.pkg.dev/learn-anything-510905/learn-anything/learn-anything-sandbox
    digest: sha256:8ca060383fc38cce37dc49f61c62705076e82facaddf5b4912847173d4a8e53b  # sha-05de6c342f979c0236878ace38f3f6da1edcd6f9 (CI, 05de6c34), built 2026-10-12
configMapGenerator:
  # Consumed by the backend only (the frontend has no runtime config; the sandbox
  # has its own). These are origins, not secrets: what the browser is told to call
  # and what this service calls, both declared in one place.
  - name: backend-config
    literals:
      - FRONTEND_DOMAIN=https://learn.lotp.xyz
      # The sign-in cookie is issued by api. and read by learn., so it has to be
      # written for the parent domain: the browser on learn. carries it back to
      # the API, and the backend is the only reader now — the frontend's edge
      # stopped verifying the cookie (frontend #149) and stopped receiving the
      # signing secret with it (infra #154). Without this the app bounces a
      # signed-in browser back to its own login page:
      # core/security.cookie_policy in the backend.
      - COOKIE_DOMAIN=.lotp.xyz
      - SANDBOX_URL=http://sandbox.learn-anything.svc.cluster.local:80
      - LOG_LEVEL=INFO
      # Which model production asks, and at which address. These two are here rather
      # than in Secret Manager because neither is a credential: an endpoint and a
      # model name are configuration, and configuration in this repository is declared
      # here, reviewed as `git diff` of this block, and applied by CI — the same
      # treatment the origins above get. In Secret Manager they had cost three things:
      # a "skip it while empty" special case in scripts/render-secrets.sh, a name in
      # scripts/secret-hygiene.sh's not-yet-filled list, and no way for a review to
      # see what production asks a model to be. The endpoint is not a secret either:
      # it carries a workspace id, not a bearer token, and reading the manifest gets
      # you no spend. The one name that stays in Secret Manager is `openai-api-key`,
      # a borrowed vendor credential whose entry is Terraform's and whose value is a
      # person's (gcp/secrets.tf, gcp/app_secrets.tf).
      #
      # A change here changes the ConfigMap's content hash, so the pod template
      # changes and the Deployment rolls on the next apply. That is not true of a
      # rendered Secret, which reaches a pod only when the pod is replaced.
      #
      # The one thing this file cannot assert is reachability: a hostname in a
      # ConfigMap says nothing about whether a pod in asia-east2 can open a
      # connection to it. That is measured from inside a pod (M8's finding), not here.
      - OPENAI_BASE_URL=https://ws-ilvrl4nqmzl0yqu5.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
      - LLM_MODEL=qwen3.8-flash
      # --- Model-call budgets: the tuning table from the backend's local .env ---
      #
      # Copied as written, with the endpoint/key/model names excluded (those are
      # above). What each line does is stated here because they are not the same
      # kind of line: some restate what the code already defaults to, some change
      # what production does on every call, and one is a dated mitigation for a
      # failure this cluster actually had.
      #
      # The mitigation. `probe.generate_batch` asked for {reasoning_effort: low,
      # max_tokens: 3072} (core/reasoning.py's table, measured against a llama.cpp
      # server that is no longer in this path) and one call used 3070 completion
      # tokens of which 3061 were reasoning: no content, and the structured parse
      # raised LengthFinishReasonError at 50.5s. 65536 is the value the local
      # experiment used; it fixed that phase (the next session ran five probe
      # rounds clean) and the failure moved to `material.write_slide` at 4096, where
      # a slide's own content overflowed. These caps are sized for a model that no
      # longer answers here; the durable decision is the backend re-measuring its
      # own stage table.
      - LLM_MAX_OUTPUT_TOKENS_PROBE_GENERATE_BATCH=65536
      # Every *other* stage's output cap. Precedence is per-stage-first, so this
      # raises clarify/plan/material to 10240 and leaves the probe stage at 65536.
      - LLM_MAX_OUTPUT_TOKENS=10240
      # What a call may think. The global `low` overrides the code table, which is
      # the loud one here: that table deliberately puts the restating stages
      # (generate_questions, refine_goal, the language helpers) at `minimal`, and
      # `low` raises them — thinking where the app decided none was needed. The
      # slide override below is the counterweight the local table carries with it.
      - REASONING_EFFORT=low
      - REASONING_EFFORT_MATERIAL_WRITE_SLIDE=minimal
      # The client itself. Both numbers are what core/llm.py already defaults to
      # (120s, 2 retries); declaring them states the ceiling production runs with,
      # which is worth more than the no-op. The balancer's ceiling is separate:
      # manifests/base/backend-config.yaml, 600s.
      - LLM_REQUEST_TIMEOUT_SECONDS=120
      - LLM_MAX_RETRIES=2
      # How a call decodes. Today every stage except the slide ladder sends no
      # sampling parameters at all, so these change behaviour, not just
      # configuration: clarify/probe/plan stages that inherited the provider's own
      # defaults now get 0.7 with top_k 40, min_p 0.05, repeat_penalty 1.05. Two
      # honest caveats: the values were chosen against llama.cpp, and top_k/min_p/
      # repeat_penalty travel in `extra_body`, which this endpoint accepts but which
      # it may ignore — a knob that looks configured and is not honoured is the
      # quieter failure. `evaluate_batch` is pinned at 0.2 because a stage that
      # grades answers should not decode at 0.7.
      - LLM_TEMPERATURE=0.7
      - LLM_TOP_P=0.8
      - LLM_TOP_K=40
      - LLM_MIN_P=0.05
      - LLM_REPEAT_PENALTY=1.05
      - LLM_PRESENCE_PENALTY=0.0
      - LLM_FREQUENCY_PENALTY=0.0
      # The slide ladder, written out. These two restate the table in
      # graphs/material/sandbox.py exactly (0.4/0.2/0.1 with top_k 25/15/10), and
      # they have to be stated: a global sampling value beats a stage's own
      # code-stated ladder, so without them the deck's attempts would flatten to
      # 0.7. The 0.2 line is the same reasoning for the grading stage.
      - LLM_TEMPERATURE_MATERIAL_WRITE_SLIDE=0.4,0.2,0.1
      - LLM_TOP_K_MATERIAL_WRITE_SLIDE=25,15,10
      - LLM_TEMPERATURE_PROBE_EVALUATE_BATCH=0.2

  # Consumed by the sandbox only. `NEXT_PUBLIC_BACKEND_URL` looks like a
  # build-time name but is read server-side here (the /slides route fetches the
  # slide source), so it is runtime configuration and it points at the cluster's
  # internal address: that hop never leaves the VPC and should not pay for a trip
  # out through the load balancer.
  - name: sandbox-config
    literals:
      - ALLOWED_FRAME_ANCESTORS=https://learn.lotp.xyz
      - NEXT_PUBLIC_BACKEND_URL=http://backend.learn-anything.svc.cluster.local:80

# The generated names get a content hash, so changing a value here changes the pod
# template and the Deployment actually rolls. The cost is that superseded
# ConfigMaps stay behind; `kubectl get configmap` in this namespace is not a lie,
# just a little historical.
