# Frontend and sandbox: one replica each, always. **This is the design** (option D,
# chosen 2026-10-08); the paragraph below is why the design is a floor rather than
# a scale-from-zero, so that nobody "optimises" it back to zero.
#
# The design (ADR 0001, PLAN.md M3) is that these two tiers sleep at zero and wake
# on demand. Nothing installed does that: the option chosen on paper (KEDA with a
# request-count scaler) was never installed, and M6 measured what the mechanism
# would have to beat. A browser request to a global Application Load Balancer goes
# to a NEG; there is no queue in front of the pod, so a scaler can only react to
# ALB request metrics, which arrive minutes late — and after a pod *is* Ready, its
# NEG attaches 1–4 minutes later still, answering 502 meanwhile. Scale-from-zero on
# this platform is therefore not a knob on the Deployment; it needs a proxy that
# queues (Knative's activator, KEDA's HTTP add-on) or a different product for those
# tiers (Cloud Run, PLAN.md M3 option C). Both cost roughly what the idle pods
# would have saved: the plan's own corrected arithmetic puts KEDA at ~$25–38/month
# for control-plane pods alone.
#
# So the choice is the floor: one replica each, accepted as ~$50/month of pods
# including the backend — inside the trial credit's $3.30/day ceiling, above the
# monthly figure this project once targeted, and irreducible by lowering requests,
# because Autopilot bills a per-pod floor of 0.25 vCPU / 1 GiB whatever the
# container asks for. What is *not* accepted is pretending the alternative is
# cheap: the queueing options (Knative's activator, KEDA's HTTP add-on) cost
# control-plane pods that are themselves at the floor, which is most of what they
# save. The lever that would change the arithmetic is running these two tiers
# somewhere that queues (Cloud Run), and that is a topology change, not a knob
# here — see docs/adr/0001's amendment.
#
# What this patch is for: a browser visiting learn.lotp.xyz gets the app, and the
# backend's internal call to the sandbox reaches an endpoint. Both of those failed
# with a 502 while these numbers were 0. If a later topology change moves these
# tiers elsewhere, this file and the two Deployments go together.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
spec:
  replicas: 1
