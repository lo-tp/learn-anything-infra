# The migration gate (PLAN.md M5): `alembic upgrade head` runs as a Job, before
# anything else in a deploy is allowed to change.
#
# This file is a **template**, and it is deliberately not in the kustomization.
# A Job's pod template is immutable: applying a Job of the same name with a
# different image is rejected by the API rather than rolled. That is a good
# property — a Job that already ran cannot be quietly re-run — but it means the
# name has to change whenever the image does, and a generator that renames things
# would rename the Deployments too. So `scripts/deploy.sh` fills in the two
# placeholders below, with a name derived from the image digest, and applies it on
# its own.
#
# The name being derived from the digest is what makes a deploy repeatable: the
# same image produces the same Job name, so re-running the deploy of something that
# already migrated is a no-op instead of a second migration racing the first. A new
# image always produces a new Job, so a migration is never skipped because a stale
# Job object happened to be lying around.
#
#   __IMAGE__    the exact image reference the overlay is about to deploy
#   __JOB_NAME__ migrate-<12 hex of that image's digest>-<6 hex of this file's
#                rendered pod template>. The second half exists because editing
#                *this* file is also a change to what runs: the first deploy after
#                such an edit would otherwise be rejected as "field is immutable".
#                scripts/deploy.sh fills both in.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: learn-anything
    app.kubernetes.io/component: migration
spec:
  # No retries. A migration that fails is a fact about the schema and the code, not
  # a transient error, and three identical failures in a row bury the one log line
  # that explains it.
  backoffLimit: 0
  # A migration that hangs would otherwise hold the deploy open forever; the
  # deploy script waits on this Job, so "hung" has to be a thing that can end.
  activeDeadlineSeconds: 900
  # Old Jobs clean themselves up; the log of the one that mattered is in the
  # deploy output, and the object is not a record anyone should be auditing.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: learn-anything
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      # Alembic talks to one Postgres in this namespace and to no Google API, so
      # there is no reason for it to hold a cloud identity.
      automountServiceAccountToken: false
      securityContext:
        # The same requirement the backend Deployment makes, and the reason this
        # container runs migrations rather than a root shell that could quietly do
        # more than the app ever will. No `runAsUser` here on purpose: the uid
        # belongs to the image (Dockerfile `USER 10001`), and a second copy of it
        # in a manifest is a fact that goes stale when the image changes.
      containers:
        - name: migrate
          image: __IMAGE__
          # Not the image's entrypoint: this container exists to run migrations,
          # and saying so is what makes the Job's log readable.
          command: ["alembic", "upgrade", "head"]
          envFrom:
            # The same Secret the backend reads: `DATABASE_URL`, in the
            # driver-less form the app rewrites. One credential, one definition.
            - secretRef:
                name: backend-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
