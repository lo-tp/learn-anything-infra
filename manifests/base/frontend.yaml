# The web app. Scales to zero when unused (ADR 0001): the cost of this Deployment
# while nobody is visiting is the cost of nothing.
#
# Note what is *not* here: `NEXT_PUBLIC_*`. Those are inlined into the bundle at
# build time, which is why the image is environment-specific (PLAN.md M2) and why
# an environment's config cannot retarget a frontend that is already built. The
# only runtime secret this container needs is the cookie-signing `JWT_SECRET`,
# shared with the backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: learn-anything
    app.kubernetes.io/component: web
spec:
  # The HPA owns this number. 1 is the starting point so a first request is not
  # racing a cold start against the scaler; whether it is still 1 when you read
  # this depends on traffic, which is the intended state.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: learn-anything
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: asia-east2-docker.pkg.dev/learn-anything-510905/learn-anything/learn-anything-frontend:placeholder
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: frontend-env
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # This probe is read by two judges, and they do not agree about what
          # passing means. GKE builds the load balancer's health check for the NEG
          # from it (M6), so the kubelet sees it too: the kubelet counts any 2xx
          # *or* 3xx as success, GCE HTTP health checks accept exactly 200 and will
          # not be configured otherwise
          # (https://github.com/kubernetes/ingress-gce/issues/1768). A path that
          # redirects passes one judge and fails the other, which is the whole shape
          # of the failure: the pods read Ready, CI reads green, and the public
          # surface serves Google's own 502 page. So the definition both can use is
          # a 200 with nothing behind it — `/api/health`, which is what that path is
          # in the frontend image: a Route Handler rather than a page, so no layout
          # and no render, and outside `app/[locale]`, so neither locale redirects
          # nor the `[locale]/[...all]` catch-all can claim it.
          #
          # It was `/en/login` until the frontend deleted the sign-in page and the
          # path fell through to that catch-all (#158 in the frontend repository):
          # a 307, an unhealthy NEG, and a 502 for every URL under that hostname.
          # The path is therefore paired with `app/api/health/route.ts` over there —
          # either repository moving it on its own reproduces the outage, and only a
          # probe against the running image says so.
          #
          # The balancer's own health check is declared below as `frontend-health`
          # rather than left to be inferred from this probe. The inference happens
          # once, when the NEG is created; editing the probe afterwards moves the
          # kubelet's probe and nothing else. Two judges with silently different
          # definitions of one check is the bug, so the URL now has one definition,
          # written down.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: learn-anything
  annotations:
    # Attaching a BackendConfig by port is the documented shape for a NEG backend
    # (https://cloud.google.com/kubernetes-engine/docs/concepts/backend-config).
    cloud.google.com/backend-config: '{"ports": {"80": "frontend-health"}}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The load balancer's health check for this workload, said out loud.
#
# M6's notes recorded three BackendConfigs with `healthCheck` blocks that "changed
# nothing", and the reason is worth keeping: for a NEG the controller derives the
# health check from the workload's readiness probe *once*, at NEG creation, and
# then leaves it alone. Editing the probe on an existing NEG changes the kubelet's
# probe and nothing else — which is how #158 survived its own deploy. The pods
# rolled to an image that answers `/api/health`, the Deployment was healthy, the
# rollout converged, and the cloud health check created on 2026-10-07 kept asking
# for `/en/login`. What `kubectl` calls Ready and what the URL map routes to are
# two different questions, and only one of them lives in the Deployment.
#
# The interval and timeout below are the ones the controller arrived at by itself;
# nothing is tuned, only written down. The number that matters is `requestPath`,
# and it has to agree with the readiness probe above and with
# `app/api/health/route.ts` in the frontend repository. Those three are one fact
# about one URL.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: frontend-health
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: learn-anything
spec:
  healthCheck:
    type: HTTP
    requestPath: /api/health
    # The NEG's serving port; naming it keeps the object readable.
    port: 3000
    checkIntervalSec: 15
    timeoutSec: 15
    healthyThreshold: 1
    unhealthyThreshold: 2
---
# Scale-to-zero is what makes an idle app free (ADR 0001), and this is where that
# design meets the API. Two facts, both measured against this cluster rather than
# read off a blog:
#
#   1. `minReplicas: 0` is **rejected** when the only metric is a Resource metric:
#      "spec.minReplicas: Invalid value: 0: must be greater than or equal to 1 …
#      must specify at least one Object or External metric to support scaling to
#      zero replicas".
#   2. Even where it is accepted, an HPA scales *to* zero and not *from* it: with
#      no pods there is no CPU average to act on, so nothing starts them again.
#
# So there is **no HPA in this file**. The placeholder that used to be here said
# `minReplicas: 1`, which would have scheduled a paying pod for an image that does
# not exist yet and would have fought the zero-replica state that scale-from-zero
# requires. The chosen answer is KEDA (PLAN.md M3, option A): a ScaledObject owns
# waking these two on request, and a Deployment they manage stays at zero. The
# cost of that choice is recorded there honestly — KEDA's own pods are a
# floor-priced always-on set, roughly what pinning these two would cost.
