# The web app. Scales to zero when unused (ADR 0001): the cost of this Deployment
# while nobody is visiting is the cost of nothing.
#
# Note what is *not* here: `NEXT_PUBLIC_*`. Those are inlined into the bundle at
# build time, which is why the image is environment-specific (PLAN.md M2) and why
# an environment's config cannot retarget a frontend that is already built. The
# only runtime secret this container needs is the cookie-signing `JWT_SECRET`,
# shared with the backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: learn-anything
    app.kubernetes.io/component: web
spec:
  # The HPA owns this number. 1 is the starting point so a first request is not
  # racing a cold start against the scaler; whether it is still 1 when you read
  # this depends on traffic, which is the intended state.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: learn-anything
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: asia-east2-docker.pkg.dev/learn-anything-510905/learn-anything/learn-anything-frontend:placeholder
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: frontend-env
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: learn-anything
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Scale-to-zero is what makes an idle app free (ADR 0001), and this is where that
# design meets the API. Two facts, both measured against this cluster rather than
# read off a blog:
#
#   1. `minReplicas: 0` is **rejected** when the only metric is a Resource metric:
#      "spec.minReplicas: Invalid value: 0: must be greater than or equal to 1 …
#      must specify at least one Object or External metric to support scaling to
#      zero replicas".
#   2. Even where it is accepted, an HPA scales *to* zero and not *from* it: with
#      no pods there is no CPU average to act on, so nothing starts them again.
#
# So there is **no HPA in this file**. The placeholder that used to be here said
# `minReplicas: 1`, which would have scheduled a paying pod for an image that does
# not exist yet and would have fought the zero-replica state that scale-from-zero
# requires. The chosen answer is KEDA (PLAN.md M3, option A): a ScaledObject owns
# waking these two on request, and a Deployment they manage stays at zero. The
# cost of that choice is recorded there honestly — KEDA's own pods are a
# floor-priced always-on set, roughly what pinning these two would cost.
