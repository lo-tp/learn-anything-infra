# The API. One replica, never scaled to zero, replaced rather than rolled — see
# docs/adr/0003-single-replica-backend.md. The reason is in the app itself:
# LangGraph session state lives in the process, so a second replica would split
# one conversation across two memories, and a RollingUpdate would serve requests
# from two versions mid-rollout. If that ever becomes wrong, the fix is to move
# the state out (ADR 0003's consequence), not to add replicas here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: learn-anything
    app.kubernetes.io/component: api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: learn-anything
        app.kubernetes.io/component: api
    spec:
      # Nothing here talks to the Kubernetes API, so the token is not mounted.
      automountServiceAccountToken: false
      containers:
        - name: backend
          # Tag replaced with a digest by the overlay (M5: CI runs
          # `kustomize edit set image`). A tag here would let a deploy name an
          # image that no longer means what it says.
          image: asia-east2-docker.pkg.dev/learn-anything-510905/learn-anything/learn-anything-backend:placeholder
          ports:
            - name: http
              containerPort: 8000
          # Non-secret per-environment config (origins, model name) comes from the
          # overlay's ConfigMap; secret material is rendered into a Secret by CI
          # (M7) and never appears in this repo.
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-env
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # /health does not touch the database on purpose: a readiness probe that
          # depends on Postgres turns a slow database into a restart cascade, and
          # a single-replica service cannot afford both at once.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: learn-anything
  annotations:
    # How the load balancer finds the BackendConfig next to it. The JSON names the
    # *default* backend of this Service; a single-port service still has to say so.
    cloud.google.com/backend-config: '{"default": "backend-request-timeout"}'
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 80
      targetPort: http
