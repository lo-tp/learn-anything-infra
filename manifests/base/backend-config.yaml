# One field, and it is a ceiling on what a request can be.
#
# The load balancer's default backend timeout is 30 seconds. That is not
# theoretical here: an acceptance request that reached the backend and was still
# working when the balancer gave up came back as an HTML 502 from Google at
# 30.8 s — while the pod kept working on it. A model turn can take longer than
# that, and the session phases that call a model are synchronous by design
# (`POST /sessions`, `/clarify`, `/probe`), so without this line the platform's
# limit, not the model's, decides how long one turn may be.
#
# This is the one BackendConfig this project needs. The health-check blocks that
# used to be here are gone on purpose: this controller builds the load balancer's
# health check from the workload's readiness probe, and three BackendConfigs with
# correct `healthCheck` blocks changed nothing (M6's notes). A timeout is a
# different field, and the documented one
# (https://cloud.google.com/kubernetes-engine/docs/concepts/backend-config).
#
# Attached to the Service by annotation; the balancer reads it from there.
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: backend-request-timeout
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: learn-anything
spec:
  # Ten minutes, chosen deliberately rather than maximally: the API accepts up to
  # 2³¹−1 seconds, and nothing about the bill changes with this number (load
  # balancing is billed per forwarding rule and per GB processed, not per second of
  # patience). What a larger ceiling buys is *capacity held*: a session phase is
  # synchronous, so a request that lives for ten minutes occupies a worker for ten
  # minutes, and at one replica that queue is the cost. It also lets more retries
  # live long enough to happen, which is the only part of this that is money.
  #
  # The consequence of setting it high is that this is no longer the first limit to
  # be hit: the backend's own HTTP client timeouts for the model call, and the
  # frontend's fetch timeouts, sit below it and will answer first. If a turn ever
  # needs genuinely more than a few minutes, the fix is an asynchronous phase
  # (`/plan/approve` and `/sessions/{id}/materials` already work that way), not a
  # larger number here.
  timeoutSec: 600
